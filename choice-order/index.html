<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지필평가 선택지 정렬기</title>
<link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://luminousky.com/apple-touch-icon.png">
<script>
  // 그리기 전에 테마를 정한다 (저장한 값 → 기기 설정). 랜딩과 같은 'theme' 키를 쓴다
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="./style.css">
<script src="./sorter.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="어두운 화면으로 바꾸기">
      <svg class="icon-moon" viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.3 12.4A7.5 7.5 0 0 1 7.6 2.7a7.5 7.5 0 1 0 9.7 9.7Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
    </button>
    <div>
      <!-- 상위(도구 모음)로 올라가는 배지 -->
      <a class="crumb" href="../">&larr; 지필평가 도구</a>
      <h1>지필평가 선택지 정렬기</h1>
      <p class="lede">원안지의 선택지나 보기를 붙여 넣으면 글자 수나 사전순으로 정리합니다.<br>입력한 내용은 이 브라우저 밖으로 나가지 않습니다.</p>
      <div class="top-meta">
        <a class="btn" href="https://github.com/itmir913/exam-tools/releases/latest/download/choice-order.zip">오프라인용 내려받기 (.zip)</a>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- 왼쪽: 정렬 조건 -->
    <aside class="panel settings" aria-label="정렬 조건">
      <div class="group">
        <h2>정렬</h2>
        <div id="orderBar" role="group" aria-label="정렬 기준" class="chips">
          <button type="button" class="chip" data-val="orig" aria-pressed="false">원본 순서</button>
          <button type="button" class="chip" data-val="len" aria-pressed="true">짧은 순</button>
          <button type="button" class="chip" data-val="lenDesc" aria-pressed="false">긴 순</button>
          <button type="button" class="chip" data-val="abc" aria-pressed="false">사전순</button>
          <button type="button" class="chip" data-val="abcDesc" aria-pressed="false">사전 역순</button>
          <button type="button" class="chip" data-val="headLen" aria-pressed="false">머리말 묶음 → 짧은 순</button>
          <button type="button" class="chip" data-val="headLenDesc" aria-pressed="false">머리말 묶음 → 긴 순</button>
        </div>
        <p id="headMsg" class="hidden note"></p>
      </div>
      <div class="group">
        <h2>번호</h2>
        <div id="markBar" role="group" aria-label="번호 모양" class="chips">
          <button type="button" class="chip" data-val="keep" aria-pressed="true">원본 번호</button>
          <button type="button" class="chip" data-val="circle" aria-pressed="false">①②③</button>
          <button type="button" class="chip" data-val="circleK" aria-pressed="false">㉠㉡㉢</button>
          <button type="button" class="chip" data-val="kor" aria-pressed="false">ㄱㄴㄷ</button>
          <button type="button" class="chip" data-val="num" aria-pressed="false">1. 2. 3.</button>
          <button type="button" class="chip" data-val="paren" aria-pressed="false">(1)(2)(3)</button>
          <button type="button" class="chip" data-val="latin" aria-pressed="false">A. B. C.</button>
          <button type="button" class="chip" data-val="parenL" aria-pressed="false">(A)(B)(C)</button>
          <button type="button" class="chip" data-val="hangul" aria-pressed="false">(가)(나)</button>
          <button type="button" class="chip" data-val="bullet" aria-pressed="false">◦</button>
          <button type="button" class="chip" data-val="none" aria-pressed="false">없음</button>
        </div>
      </div>
      <div class="group">
        <h2>배치</h2>
        <div id="layoutBar" role="group" aria-label="답항 배치" class="chips">
          <button type="button" class="chip" data-val="keep" aria-pressed="true">원본 배치</button>
          <button type="button" class="chip" data-val="1" aria-pressed="false">1행답항</button>
          <button type="button" class="chip" data-val="2" aria-pressed="false">2행답항</button>
          <button type="button" class="chip" data-val="3" aria-pressed="false">3행답항</button>
          <button type="button" class="chip" data-val="4" aria-pressed="false">4행답항</button>
          <button type="button" class="chip" data-val="5" aria-pressed="false">5행답항</button>
        </div>
      </div>
      <div class="group">
        <h2>구분자</h2>
        <div id="sepBar" role="group" aria-label="선택지 사이 구분자" class="chips">
          <button type="button" class="chip" data-val="keep" aria-pressed="false">원본 구분자</button>
          <button type="button" class="chip" data-val="sp1" aria-pressed="false">공백 1칸</button>
          <button type="button" class="chip" data-val="tab" aria-pressed="true">탭</button>
          <button type="button" class="chip" data-val="tab2" aria-pressed="false">탭 2칸</button>
          <button type="button" class="chip" data-val="sp2" aria-pressed="false">공백 2칸</button>
          <button type="button" class="chip" data-val="sp4" aria-pressed="false">공백 4칸</button>
        </div>
      </div>
      <div class="group">
        <h2>옵션</h2>
        <div class="checks">
          <label><input id="optTrim" type="checkbox" checked> 선택지 앞뒤 공백 제거하기</label>
          <label><input id="optJoin" type="checkbox" checked> 여러 줄 선택지를 한 줄로 합치기</label>
          <label><input id="optNoSpace" type="checkbox"> 글자 수 계산 시 공백 제외하기</label>
        </div>
      </div>
    </aside>

    <!-- 오른쪽: 붙여 넣기 → 결과 -->
    <div class="main">
      <section class="panel block" aria-label="붙여 넣기">
        <div class="block-head">
          <h2>붙여 넣기</h2>
          <span id="kindMsg" class="meta" aria-live="polite"></span>
          <span class="spacer">
            <button id="sampleBtn" type="button" class="btn">예시 넣기</button>
            <button id="clearBtn" type="button" class="btn">비우기</button>
          </span>
        </div>
        <textarea id="input" class="paste" spellcheck="false" aria-label="선택지 붙여 넣기"
          placeholder="예:&#10;① A&#9;② B&#9;③ C&#9;④ D&#9;⑤ E"></textarea>
      </section>

      <div id="errorBox" class="hidden callout" role="alert"></div>

      <section id="resultSec" class="panel block is-idle" aria-label="정렬 결과" aria-disabled="true">
        <div class="block-head">
          <h2>정렬 결과</h2>
          <span class="spacer">
            <button id="resetBtn" type="button" class="btn hidden">자동 정렬로 되돌리기</button>
          </span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th class="move-col">순서</th><th class="num-col">번호</th><th>선택지</th><th class="right">글자 수</th><th class="copy-col"><span class="sr-only">복사</span></th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <p class="hint row-hint"><span id="rowMsg" aria-live="polite"></span></p>

        <textarea id="output" class="paste out" readonly spellcheck="false" aria-label="정렬 결과"
          placeholder="붙여 넣으면 여기에 정렬한 결과가 나옵니다."></textarea>
        <p class="hint">탭은 시험지처럼 일정한 칸(공백 16칸 자리)에서 끊기게 그렸습니다. 복사하면 탭은 탭 그대로 나가므로 한글·워드·엑셀에서 칸이 맞습니다.</p>
        <div class="copy-bar">
          <button id="copyBtn" type="button" class="btn primary" disabled>결과 복사</button>
          <span id="copyMsg" class="meta" aria-live="polite"></span>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const X = window.ChoiceOrder;

/* ───────────── 결과 만들기 ───────────── */
// custom: 교사가 ▲▼로 정한 순서 (자리마다 놓을 선지 번호). 없으면 고른 기준대로 자동 정렬한다
const state = { order: 'len', mark: 'keep', layout: 'keep', sep: 'tab', outText: '', rowText: [], custom: null, picked: [] };
const ROW_HINT = '▲ ▼로 선택지의 자리를 바꾸면 아래 결과에 바로 반영됩니다. 번호는 자리에 그대로 남습니다.';

// 결과 카드는 늘 보인다. 보여 줄 결과가 없으면 비우고 흐리게 둘 뿐 없애지 않는다
function setIdle(idle) {
  $('resultSec').classList.toggle('is-idle', idle);
  $('resultSec').setAttribute('aria-disabled', String(idle));
  $('copyBtn').disabled = idle;
  if (idle) {
    state.outText = '';
    state.rowText = [];
    state.picked = [];
    state.custom = null;
    $('output').value = '';
    $('output').style.height = '';
    showCustom(false);
    $('tbody').replaceChildren();
    $('copyMsg').textContent = '';
    $('headMsg').classList.add('hidden');
  }
}

// 화면을 몇 번 새로 그렸는지. ▲▼가 잠금을 푸는 사이 다른 단추가 표를 다시 그렸는지 본다
let drawn = 0;

/* 결과 칸을 글에 맞춰 늘인다. 줄 수만 맞추면 긴 줄의 가로 스크롤 막대가 높이를 먹어
   (Windows처럼 막대가 자리를 차지하는 곳에서) 아래가 잘리고 세로 스크롤이 생긴다 */
function fitOutput() {
  const out = $('output');
  out.style.height = '';
  if (out.value === '') return;
  out.style.height = out.scrollHeight + (out.offsetHeight - out.clientHeight) + 'px';
}
window.addEventListener('resize', fitOutput);

function render() {
  drawn++;
  const text = $('input').value;
  const err = $('errorBox');
  if (text.trim() === '') {
    setIdle(true);
    err.classList.add('hidden');
    $('kindMsg').textContent = '';
    return;
  }

  const noSpace = $('optNoSpace').checked;
  const r = X.rearrange(text, {
    order: state.order, mark: state.mark, layout: state.layout, sep: state.sep,
    trim: $('optTrim').checked, noSpace, join: $('optJoin').checked,
    picked: state.custom,
  });

  if (!r.ok) {
    setIdle(true);
    err.textContent = '선택지를 두 개 이상 찾지 못했습니다. 번호가 붙은 선택지나 줄마다 하나씩 적은 글을 붙여 넣어 주세요.';
    err.classList.remove('hidden');
    $('kindMsg').textContent = '';
    return;
  }
  err.classList.add('hidden');
  $('kindMsg').textContent = r.kindName + ' · 선택지 ' + r.items.length + '개';

  // 선지 수가 바뀌어 손으로 정한 순서가 맞지 않으면 sorter.js가 버리고 자동 정렬한다
  if (state.custom && state.custom.join() !== r.picked.join()) state.custom = null;
  state.picked = r.picked;
  showCustom(state.custom !== null);

  // 머리말 묶음을 골랐는데 묶을 머리말이 없으면 그냥 길이순과 같아지므로 알려 준다.
  // 손으로 순서를 바꾼 동안에는 묶음 순서가 아니므로 알리지 않는다
  const headBox = $('headMsg');
  if (!state.custom && (state.order === 'headLen' || state.order === 'headLenDesc')) {
    const info = X.headInfo(r.items);
    const desc = state.order === 'headLenDesc';
    headBox.textContent = info.ok
      ? '머리말 ' + info.kinds.slice(0, 6).join(' · ') + ' 로 묶은 뒤, 묶음 안에서 ' + (desc ? '긴' : '짧은') + ' 순으로 늘어놓았습니다.'
      : '앞머리에 (가)나 A. 같은 머리말이 없어 묶을 것이 없습니다. ' + (desc ? '긴' : '짧은') + ' 순과 같은 결과입니다.';
    headBox.classList.remove('hidden');
  } else {
    headBox.classList.add('hidden');
  }

  state.outText = r.out;
  const out = $('output');
  out.value = r.out;
  out.rows = Math.max(3, r.out.split('\n').length);
  fitOutput();
  setIdle(false);
  $('copyMsg').textContent = '';
  $('rowMsg').textContent = ROW_HINT;

  // 위 표: 자리마다 놓인 선지. ▲▼로 옆 자리와 바꾸고, 복사로 그 선지만 복사한다
  state.rowText = r.placed;
  // 번호 칸에는 그 선지가 원래 있던 자리 → 지금 자리를 보인다 (ㄱ → ㄷ).
  // 번호가 없거나 모두 같은 머리표(◦)면 자리를 가를 수 없으므로 1) 2) 3)으로 적는다
  const last = r.placed.length - 1;
  const named = r.markers.every(m => m !== '') && new Set(r.markers).size === r.markers.length;
  const label = k => named ? r.markers[k] : (k + 1) + ')';
  $('tbody').innerHTML = r.placed.map((body, i) => {
    const from = r.picked[r.slots[i].slot];
    const mark = label(i);
    const num = from === i
      ? '<span class="now">' + esc(mark) + '</span>'
      : '<span class="was">' + esc(label(from)) + '</span><span class="arrow" aria-hidden="true">→</span><span class="now">' + esc(mark) + '</span>';
    return '<tr data-i="' + i + '">'
      + '<td class="move">'
      +   '<button type="button" class="icon-btn" data-act="up" aria-label="' + esc(mark) + ' 자리의 선택지를 위로"' + (i === 0 ? ' disabled data-edge' : '') + '>▲</button>'
      +   '<button type="button" class="icon-btn" data-act="down" aria-label="' + esc(mark) + ' 자리의 선택지를 아래로"' + (i === last ? ' disabled data-edge' : '') + '>▼</button>'
      + '</td>'
      + '<td class="num" aria-label="' + esc(from === i ? mark + ', 제자리' : label(from) + '에서 ' + mark + '로') + '">' + num + '</td>'
      + '<td class="body">' + esc(body) + '</td>'
      + '<td class="right">' + X.lengthOf(body, noSpace) + '</td>'
      + '<td class="copy"><button type="button" class="btn small" data-act="copy">복사</button></td>'
      + '</tr>';
  }).join('');
  // 잠긴 동안 다른 단추가 표를 다시 그렸으면 새 단추도 잠가 둔다 (풀 때 함께 푼다)
  if (locked) for (const b of $('tbody').querySelectorAll('button')) b.disabled = true;
}

// 손으로 순서를 바꾼 동안에만 되돌릴 단추를 보인다. 단추가 보이는 것으로 손댄 줄 안다
function showCustom(on) {
  $('resetBtn').classList.toggle('hidden', !on);
}

/* 연타 막기: ▲▼를 누르면 순서를 바꾸고 표를 다시 그려 화면에 보일 때까지
   표의 단추를 모두 잠근다. 그 뒤에 누른 것은 그때 그 자리에 있는 선지에 적용된다 */
let locked = false;

function lockTable() {
  locked = true;
  $('tbody').setAttribute('aria-busy', 'true');
  for (const b of $('tbody').querySelectorAll('button')) b.disabled = true;
}

function unlockTable(then) {
  // 두 프레임을 넘기면 바뀐 표가 화면에 그려진 뒤다
  requestAnimationFrame(() => requestAnimationFrame(() => {
    locked = false;
    $('tbody').removeAttribute('aria-busy');
    // 맨 위 ▲와 맨 아래 ▼는 그대로 못 누르게 둔다
    for (const b of $('tbody').querySelectorAll('button')) b.disabled = b.hasAttribute('data-edge');
    then();
  }));
}

/* i번째 자리의 선지를 옆 자리(step: -1 위, +1 아래)의 선지와 바꾼다 */
function move(i, step, act) {
  const j = i + step;
  if (locked || j < 0 || j >= state.picked.length) return;
  locked = true;
  const next = state.picked.slice();
  [next[i], next[j]] = [next[j], next[i]];
  state.custom = next;
  // 누른 선택지가 화면에 보이던 높이를 적어 둔다 (아래에서 그 자리에 붙들어 둔다)
  const was = $('tbody').querySelector('tr[data-i="' + i + '"]');
  const box = was ? was.getBoundingClientRect() : null;
  const top = box && box.bottom > 0 && box.top < window.innerHeight ? box.top : null; // 화면에 조금이라도 보일 때만
  render();
  lockTable();
  const row = $('tbody').querySelector('tr[data-i="' + j + '"]');
  if (row) {
    // 옮긴 선택지가 손가락 밑에 그대로 있게 쪽을 같이 민다. 그래야 ▼를 연달아 눌러도 같은 선택지가 내려간다
    if (top !== null) window.scrollBy(0, row.getBoundingClientRect().top - top);
    row.classList.add('moved');
  }
  if (row) $('rowMsg').textContent = row.querySelector('.num .now').textContent + ' 자리로 옮겼습니다: ' + clip(state.rowText[j]);
  const mine = drawn;
  unlockTable(() => {
    // 그사이 다른 단추가 표를 다시 그렸으면 (정렬 칩, 입력 등) 옮긴 선지가 그 자리에 없으므로
    // 포커스를 옮기지 않는다. 그쪽을 누른 사람의 포커스를 빼앗지도 않는다
    if (drawn === mine) focusMoved(j, act);
  });
}

function focusMoved(j, act) {
  // 옮긴 선지를 따라가 같은 단추에 머문다. 끝에 닿아 그 단추를 못 누르면 반대쪽 단추로.
  // 잠긴 새 표 밖(입력 칸 등)으로 포커스가 갔으면 그대로 둔다
  const a = document.activeElement;
  if (a && a !== document.body && !$('tbody').contains(a)) return;
  const row = $('tbody').querySelector('tr[data-i="' + j + '"]');
  if (!row) return;
  const btn = row.querySelector('button[data-act="' + act + '"]');
  (btn && !btn.disabled ? btn : row.querySelector('button[data-act="' + (act === 'up' ? 'down' : 'up') + '"]')).focus();
}

// 안내 글에 싣는 선택지는 길면 줄여 보인다 (글이 길수록 줄이 늘어 화면이 출렁인다)
function clip(s, n = 24) {
  s = String(s).replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ───────────── 화면 ───────────── */
function bindBar(barId, key) {
  const bar = $(barId);
  bar.addEventListener('click', e => {
    const btn = e.target.closest('button[data-val]');
    if (!btn) return;
    state[key] = btn.dataset.val;
    // 정렬 기준을 누르면 (이미 눌린 것이라도) 손으로 정한 순서를 버리고 그 기준으로 다시 늘어놓는다
    if (key === 'order') state.custom = null;
    for (const b of bar.querySelectorAll('button[data-val]')) {
      b.setAttribute('aria-pressed', String(b === btn));
    }
    render();
  });
}
bindBar('orderBar', 'order');
bindBar('markBar', 'mark');
bindBar('layoutBar', 'layout');
bindBar('sepBar', 'sep');

// 붙여 넣은 글이 바뀌면 선지도 달라지므로 자동 정렬부터 다시 한다
$('input').addEventListener('input', () => { state.custom = null; render(); });
$('resetBtn').addEventListener('click', () => {
  state.custom = null;
  render();
  $('rowMsg').textContent = '자동 정렬로 되돌렸습니다.';
  $('copyBtn').focus();
});
$('optTrim').addEventListener('change', render);
$('optNoSpace').addEventListener('change', render);
$('optJoin').addEventListener('change', render);

$('clearBtn').addEventListener('click', () => { $('input').value = ''; state.custom = null; render(); $('input').focus(); });

/* 손에 익히라고 두는 예시. 실제 시험지 선택지가 아니라 이 도구에서 꾸며 낸 글이다 */
const SAMPLES = [
  // 한 줄에 다섯 선택지 (1행답항), 탭으로 나뉜 것
  '① 사과\t② 바나나\t③ 복숭아\t④ 블루베리\t⑤ 참외',
  // 두 줄에 나눈 답항 (2행답항)
  '① 동쪽으로 흐른다.\t② 서쪽으로 흐른다.\n'
  + '③ 남쪽으로 흐르다가 굽는다.\t④ 북쪽으로 흐르다가 바다로 든다.\n'
  + '⑤ 흐르지 않는다.',
  // 머리말이 붙은 다섯 선택지
  '① (가) - 물의 온도가 높을수록 빨리 녹는다.\n'
  + '② (가) - 저어 주면 더 고르게 섞인다.\n'
  + '③ (나) - 알갱이가 작을수록 녹는 속도가 빨라진다.\n'
  + '④ (다) - 녹는 양은 온도와 상관이 없다.\n'
  + '⑤ (다) - 다 녹은 뒤에도 무게의 합은 변하지 않는다.',
  // ㄱㄴㄷ 보기
  'ㄱ. 씨앗을 심는다.\n'
  + 'ㄴ. 햇빛이 드는 곳에 둔다.\n'
  + 'ㄷ. 흙이 마르지 않게 물을 준다.\n'
  + 'ㄹ. 싹이 트면 넓은 화분으로 옮겨 심는다.',
  // 머리표가 붙은 본문
  '◦ 소금은 물에 녹는다.\n'
  + '◦ 설탕물을 끓이면 물만 날아간다.\n'
  + '◦ 모래는 물에 가라앉아 그대로 남는다.\n'
  + '◦ 기름은 물과 섞이지 않고 위로 뜬다.',
  // 번호 없이 줄마다 하나씩
  '세 변의 길이가 모두 같다.\n'
  + '두 변의 길이가 같다.\n'
  + '한 각이 직각이다.\n'
  + '네 각의 크기가 모두 같고 네 변의 길이도 같다.',
];

let lastSample = -1;
$('sampleBtn').addEventListener('click', () => {
  let i = Math.floor(Math.random() * SAMPLES.length);
  if (SAMPLES.length > 1 && i === lastSample) i = (i + 1) % SAMPLES.length;
  lastSample = i;
  $('input').value = SAMPLES[i];
  state.custom = null;
  render();
});

/* 글자만 클립보드에 넣는다. 탭이 그대로 있으므로 엑셀에서는 칸이 나뉘어 들어간다 */
async function copyText(s) {
  try {
    await navigator.clipboard.writeText(s);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      return document.execCommand('copy');
    } finally {
      ta.remove();
    }
  }
}

$('copyBtn').addEventListener('click', async () => {
  const done = await copyText(state.outText);
  $('copyMsg').textContent = done
    ? '복사했습니다. 엑셀이나 한글에 그대로 붙여 넣으세요.'
    : '이 브라우저에서는 클립보드에 쓸 수 없습니다. 결과 칸을 선택해 직접 복사하세요.';
});

/* 표의 단추: ▲▼는 자리를 바꾸고, 복사는 그 선택지 한 개만 복사한다 */
async function copyRow(i) {
  const text = state.rowText[i];
  if (text === undefined) return;
  const done = await copyText(text);
  $('rowMsg').textContent = done
    ? '이 선택지를 복사했습니다: ' + clip(text)
    : '이 브라우저에서는 클립보드에 쓸 수 없습니다.';
}

$('tbody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled || locked) return;
  const i = Number(btn.closest('tr[data-i]').dataset.i);
  const act = btn.dataset.act;
  if (act === 'copy') copyRow(i);
  else move(i, act === 'up' ? -1 : 1, act);
});

/* 밝은 화면 / 어두운 화면 */
(function () {
  const root = document.documentElement, btn = $('themeToggle');
  const sync = () => btn.setAttribute('aria-label', root.dataset.theme === 'dark' ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
  sync();
  btn.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    sync();
  });
})();

render();
</script>
