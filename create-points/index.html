<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지필평가 배점 생성기</title>
<script>
  // 그리기 전에 테마를 정한다 (저장한 값 → 기기 설정). 랜딩·정렬기와 같은 'theme' 키를 쓴다
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="./style.css">
<script src="./solver.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="어두운 화면으로 바꾸기">
      <svg class="icon-moon" viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.3 12.4A7.5 7.5 0 0 1 7.6 2.7a7.5 7.5 0 1 0 9.7 9.7Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
    </button>
    <div>
      <!-- 상위(도구 모음)로 올라가는 배지 -->
      <a class="crumb" href="../">&larr; 지필평가 도구</a>
      <h1>지필평가 배점 생성기</h1>
      <p class="lede">총점과 문항 수를 넣으면 배점별 문항 수를 자동으로 나눕니다. 배점 종류를 최대한 늘려, 다른 문항을 틀린 학생끼리 같은 점수가 덜 나오게 합니다.</p>
      <div class="top-meta">
        <a class="btn" href="https://github.com/itmir913/exam-tools/releases/latest/download/create-points.zip">오프라인용 내려받기 (.zip)</a>
      </div>
    </div>
  </header>

  <!-- 조건 -->
  <section class="panel" aria-label="조건">
    <div class="block-head"><h2>조건</h2></div>
    <div class="fields">
      <label class="f"><span>총점</span><input id="total" type="number" min="1" step="any" value="100" class="in"></label>
      <label class="f"><span>문항 수</span><input id="count" type="number" min="1" max="200" step="1" value="23" class="in"></label>
      <label class="f"><span>배점 간격</span>
        <select id="step" class="in">
          <option value="0.05">0.05</option>
          <option value="0.1" selected>0.1</option>
          <option value="0.2">0.2</option>
          <option value="0.25">0.25</option>
          <option value="0.5">0.5</option>
          <option value="1">1</option>
        </select></label>
      <label class="f"><span>배점 가지수</span><input id="kinds" type="number" min="1" step="1" placeholder="자동" aria-label="배점 가지수 (비우면 자동)" class="in"></label>
      <div class="f wide"><span class="lab">난이도 비율 <span class="sub">(상 : 중 : 하)</span></span>
        <div class="ratio">
          <input id="rHi" type="number" min="0" step="any" value="3" aria-label="상 비율" class="in"><b>:</b>
          <input id="rMid" type="number" min="0" step="any" value="4" aria-label="중 비율" class="in"><b>:</b>
          <input id="rLo" type="number" min="0" step="any" value="3" aria-label="하 비율" class="in">
        </div>
      </div>
    </div>

    <details id="advanced">
      <summary>세부 조건</summary>
      <div class="adv">
        <div class="f"><span class="lab">배점 범위 <button id="rangeAuto" type="button" class="link hidden">자동으로 되돌리기</button></span>
          <div class="range"><input id="min" type="number" step="any" aria-label="최소 배점" class="in"><span class="meta">~</span><input id="max" type="number" step="any" aria-label="최대 배점" class="in"></div>
          <p id="rangeHint" class="hint"></p></div>
        <div class="f"><span class="lab"><label for="maxPer">한 배점당 최대 문항 수</label> <button id="maxPerAuto" type="button" class="link hidden">자동으로 되돌리기</button></span>
          <input id="maxPer" type="number" min="1" step="1" class="in"></div>
        <label class="f"><span>배점 건너뛰기</span>
          <select id="maxSkip" class="in">
            <option value="0">허용 안 함 (연속)</option>
            <option value="1" selected>1칸까지 (예: 4.1 → 3.9)</option>
            <option value="2">2칸까지</option>
          </select></label>
        <label class="f"><span>제외할 배점</span><input id="exclude" type="text" placeholder="예: 4.0, 5" class="in"></label>
      </div>
    </details>

    <div class="actions">
      <span class="push"><span id="staleMsg" class="stale hidden">배점 생성 조건이 변경되어 재계산이 필요합니다.</span><button id="runBtn" type="button" class="btn primary big">계산</button></span>
    </div>
  </section>

  <div id="errorBox" class="hidden callout error" role="alert"></div>
  <div id="relaxBox" class="hidden callout"></div>
  <div id="noteBox" class="hidden callout info"></div>

  <!-- 결과: 카드는 늘 보이고, 보여 줄 결과가 없으면 흐리게 둔다 -->
  <section id="resultSec" class="panel is-idle" aria-label="배점표" aria-disabled="true">
    <div class="block-head">
      <h2>배점표</h2>
      <span class="spacer">
        <span id="copyMsg" class="meta" aria-live="polite"></span>
        <button id="copyBtn" type="button" class="btn primary" disabled>표 복사</button>
        <button id="linkBtn" type="button" class="btn" disabled>링크 복사</button>
      </span>
    </div>
    <p id="emptyMsg" class="note">조건을 넣고 [계산]을 누르면 배점표가 나옵니다.</p>

    <div id="navRow" class="nav hidden">
      <div class="stepper">
        <button id="prevBtn" type="button" aria-label="배점 가지수 줄이기">◀</button>
        <span id="pickLabel" class="label" aria-live="polite"></span>
        <button id="nextBtn" type="button" aria-label="배점 가지수 늘리기">▶</button>
      </div>
      <!-- 같은 가지수 안에서 다음으로 좋은 안 -->
      <div class="stepper alt">
        <button id="altPrev" type="button" aria-label="같은 가지수의 이전 안">‹</button>
        <span id="altLabel" class="label" aria-live="polite"></span>
        <button id="altNext" type="button" aria-label="같은 가지수의 다른 안">다른 안 ›</button>
      </div>
      <span id="pickMeta" class="meta"></span>
    </div>

    <div id="lockBar" class="hidden chips"></div>

    <div id="tableWrap" class="table-wrap hidden">
      <table>
        <thead>
          <tr><th style="width:4.5rem">고정</th><th>배점</th><th>문항 수</th><th>배점계</th><th>급간</th><th>난이도</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
    <div id="stats" class="stats hidden"></div>
    <p id="summary" class="note hidden"></p>
  </section>
</div>

<script>
const X = window.ExamPoints;
const $ = id => document.getElementById(id);
const TIER = ['상', '중', '하'];
const TIER_CLS = { 상: 'badge hi', 중: 'badge mid', 하: 'badge lo' };
const DEFAULT_RATIO = ['3', '4', '3'];
const LOCK_ICON = {
  on: '<svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 8V6a4 4 0 1 1 8 0v2h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h1Zm2 0h4V6a2 2 0 1 0-4 0v2Z"/></svg>',
  off: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4.8" y="8.8" width="10.4" height="8.4" rx=".8"/><path d="M7 8.8V6a3 3 0 0 1 5.8-1.1"/></svg>',
};

const state = {
  // 직접 고치기 전까지는 총점·문항 수·간격에 맞춰 자동으로 채운다
  auto: { range: true, maxPer: true },
  result: null,           // { list: 배점 가지수별 가장 좋은 안, best: 가장 좋은 가지수, options }
  view: 0,                // 지금 보고 있는 배점 가지수
  calculated: null,       // 마지막으로 계산한 조건 (바뀌었는지 비교용)
  pendingAlt: 0,          // 주소로 연 "몇 번째 안" (0 = 가장 좋은 안)
  altBusy: false,
  locks: [],              // [[배점, 문항 수], …]
  precalc: null,          // key → 항목
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const num = id => $(id).value.trim() === '' ? NaN : Number($(id).value);
const fmt = (x, step) => (+x).toFixed(X.decimalsOf(step));
const pct = x => (x * 100).toFixed(x < 0.1 ? 1 : 0) + '%';
const sameScore = (a, b) => Math.abs(a - b) < 1e-9;

// 조합 수는 아주 커질 수 있어 1억 이상은 줄여 쓴다
function countText(x) {
  if (x < 1e8) return Math.round(x).toLocaleString('ko-KR');
  return new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 }).format(x);
}

/* ───────────── 입력 ───────────── */
function base() {
  return { total: num('total'), count: num('count'), step: Number($('step').value) };
}

function fillAuto() {
  const b = base();
  if (!(b.total > 0) || !Number.isInteger(b.count) || b.count < 1) return;
  const d = X.defaultsFor(b.total, b.count, b.step);
  if (state.auto.range) { $('min').value = d.min; $('max').value = d.max; }
  if (state.auto.maxPer) $('maxPer').value = d.maxPer;
  for (const id of ['min', 'max']) $(id).classList.toggle('is-auto', state.auto.range);
  $('maxPer').classList.toggle('is-auto', state.auto.maxPer);
  $('rangeAuto').classList.toggle('hidden', state.auto.range);
  $('maxPerAuto').classList.toggle('hidden', state.auto.maxPer);
  $('rangeHint').textContent = `평균 ${+(b.total / b.count).toFixed(3)}점` + (state.auto.range ? ' · 자동: 평균 ±12.5%' : '');
}

// 난이도 비율로 상·중·하 문항 수를 정한다. 같은 배점은 상·중·하 경계를 넘을 수 없으므로
// 한 난이도에 문항이 몰리는 배분은 탐색에서 걸러진다
function tierCounts(n) {
  const ratio = ['rHi', 'rMid', 'rLo'].map(id => Math.max(0, num(id) || 0));
  return ratio.some(x => x > 0) && Number.isInteger(n) && n > 0 ? X.splitByRatio(n, ratio) : [0, n, 0];
}

function readOptions() {
  const b = base();
  const kinds = Number($('kinds').value) || 0;
  let maxPer = num('maxPer');
  // 가지수를 적게 고르면 한 배점에 문항이 더 들어가야 하므로 자동 상한을 그만큼 올린다
  if (kinds && state.auto.maxPer && Number.isInteger(b.count)) maxPer = Math.max(maxPer, Math.ceil(b.count / kinds) + 1);
  return {
    ...b,
    min: num('min'), max: num('max'),
    tiers: tierCounts(b.count),
    kinds,
    maxPer,
    maxSkip: Number($('maxSkip').value),
    exclude: $('exclude').value.split(/[,\s]+/).filter(Boolean).map(Number).filter(x => isFinite(x)),
    locks: state.locks.map(l => l.slice()),
  };
}

function checkInputs(o) {
  if (!(o.total > 0)) return '총점을 입력하세요.';
  if (!Number.isInteger(o.count) || o.count < 1) return '문항 수를 1 이상의 정수로 입력하세요.';
  if (!isFinite(o.min) || !isFinite(o.max)) return '세부 조건의 배점 범위를 입력하세요.';
  if (!Number.isInteger(o.maxPer) || o.maxPer < 1) return '한 배점당 최대 문항 수를 1 이상의 정수로 입력하세요.';
  return null;
}

// 입력 중에는 계산하지 않는다 - 조건을 다 넣고 [계산]이나 Enter를 누를 때만 계산한다.
// 그 사이에는 지난 결과를 흐리게 두어 아직 반영되지 않았음을 보여 준다
// 실제로 값이 바뀌었을 때만 표시한다 (지난 계산의 조건과 비교)
const snapshot = () => JSON.stringify(readOptions());
function schedule() {
  const changed = snapshot() !== state.calculated;
  $('staleMsg').classList.toggle('hidden', !changed);
  $('resultSec').classList.toggle('is-stale', changed);
  writeUrl();
}
/* ───────────── 계산 스레드 (Web Worker) ───────────── */
// 탐색은 worker.js에서 돌려 화면이 멈추지 않게 한다. 계산 중에 다시 [계산]을 누르면
// 돌던 계산은 버리고(worker를 끝내고) 새로 시작한다. Worker를 못 쓰는 환경(file:// 등)에서는 화면 스레드에서 푼다.
let worker = null, seq = 0;
const waiting = new Map();
function startWorker() {
  try {
    worker = new Worker('./worker.js');
  } catch (e) {
    worker = null;
    return;
  }
  worker.onmessage = e => {
    const done = waiting.get(e.data.id);
    waiting.delete(e.data.id);
    if (done) done(e.data.result);
  };
  worker.onerror = () => { worker = null; };
}
function solveAsync(opts, cfg) {
  if (!worker) return Promise.resolve(X.solveAuto(opts, cfg));
  const id = ++seq;
  return new Promise(resolve => {
    waiting.set(id, resolve);
    worker.postMessage({ id, opts, cfg });
  });
}
function cancelSolving() {
  if (!waiting.size || !worker) return;
  worker.terminate();
  waiting.clear();
  startWorker();
}

let runId = 0;
async function calculate() {
  const my = ++runId;
  cancelSolving();
  const btn = $('runBtn');
  const t0 = Date.now();
  btn.textContent = '계산 중…';
  btn.disabled = true;
  // 계산을 일으킨 것이 [계산]이든 자물쇠·문항 수든, 계산하는 동안은 배점표를 흐리게 하고 잠근다
  $('resultSec').classList.add('is-busy');
  $('resultSec').setAttribute('aria-busy', 'true');
  $('staleMsg').textContent = '계산 중…';
  $('staleMsg').classList.remove('hidden');
  // 1초가 넘어가면 멈춘 게 아니라 아직 찾는 중임을 초 단위로 알린다
  const tick = setInterval(() => {
    $('staleMsg').textContent = `계산 중… ${Math.round((Date.now() - t0) / 1000)}초`;
  }, 1000);
  try {
    await run(() => my !== runId);
  } finally {
    clearInterval(tick);
    if (my === runId) {
      btn.textContent = '계산';
      btn.disabled = false;
      $('staleMsg').textContent = '배점 생성 조건이 변경되어 재계산이 필요합니다.';
      $('staleMsg').classList.add('hidden');
      $('resultSec').classList.remove('is-stale', 'is-busy');
      $('resultSec').removeAttribute('aria-busy');
    }
  }
}
$('runBtn').addEventListener('click', calculate);
document.querySelectorAll('section[aria-label="조건"] input').forEach(i =>
  i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); calculate(); } }));

for (const id of ['total', 'count']) $(id).addEventListener('input', () => { fillAuto(); schedule(); });
$('step').addEventListener('change', () => { fillAuto(); schedule(); });
for (const id of ['min', 'max']) $(id).addEventListener('input', () => { state.auto.range = false; fillAuto(); schedule(); });
$('maxPer').addEventListener('input', () => { state.auto.maxPer = false; fillAuto(); schedule(); });
$('exclude').addEventListener('input', schedule);
$('kinds').addEventListener('input', schedule);
$('maxSkip').addEventListener('change', schedule);
$('rangeAuto').addEventListener('click', () => { state.auto.range = true; fillAuto(); schedule(); });
$('maxPerAuto').addEventListener('click', () => { state.auto.maxPer = true; fillAuto(); schedule(); });
for (const id of ['rHi', 'rMid', 'rLo']) $(id).addEventListener('input', schedule);

/* ───────────── 고정 ───────────── */
// 잠그거나 풀어도 보고 있던 배점 가지수는 그대로 두고, 그 가지수 안에서 나머지를 다시 계산한다
function setLock(value, count) {
  if (state.result) state.keepView = state.view;
  state.locks = state.locks.filter(([v]) => !sameScore(v, value));
  if (count != null) state.locks.push([value, count]);
  state.locks.sort((a, b) => b[0] - a[0]);
  renderLocks();
  calculate();
}

function renderLocks() {
  const bar = $('lockBar');
  bar.replaceChildren();
  bar.classList.toggle('hidden', !state.locks.length);
  if (!state.locks.length) return;
  const step = Number($('step').value);
  bar.append(el('span', 'meta', '고정'));
  for (const [v, c] of state.locks) {
    const chip = el('button', 'chip');
    chip.type = 'button';
    chip.title = '고정 해제';
    chip.append(el('b', '', c ? `${fmt(v, step)}점 × ${c}` : `${fmt(v, step)}점 안 씀`), el('span', 'meta', '✕'));
    chip.addEventListener('click', () => setLock(v, null));
    bar.append(chip);
  }
  const clear = el('button', 'link', '모두 해제');
  clear.type = 'button';
  clear.addEventListener('click', () => { state.keepView = state.view; state.locks = []; renderLocks(); calculate(); });
  bar.append(clear);
}

/* ───────────── 주소(URL)에 설정 저장 ───────────── */
// 자동으로 채운 값과 기본값은 주소에 쓰지 않는다
function writeUrl() {
  const p = [];
  const put = (k, v) => p.push(k + '=' + encodeURIComponent(v).replace(/%2C/g, ','));
  put('total', $('total').value);
  put('n', $('count').value);
  put('step', $('step').value);
  const ratio = ['rHi', 'rMid', 'rLo'].map(id => $(id).value.trim());
  if (ratio.join('-') !== DEFAULT_RATIO.join('-')) put('ratio', ratio.join('-'));
  if (!state.auto.range) { put('min', $('min').value); put('max', $('max').value); }
  if (!state.auto.maxPer) put('maxPer', $('maxPer').value);
  if (Number($('kinds').value) > 0) put('kinds', $('kinds').value);
  if ($('maxSkip').value !== '1') put('skip', $('maxSkip').value);
  const e = state.result && entry();
  if (e && e.alt > 0) put('alt', e.alt + 1);
  const ex = $('exclude').value.split(/[,\s]+/).filter(Boolean).join(',');
  if (ex) put('exclude', ex);
  if (state.locks.length) put('lock', state.locks.map(([v, c]) => `${v}x${c}`).join(','));
  history.replaceState(null, '', location.pathname + '?' + p.join('&'));
}

function readUrl() {
  const q = new URLSearchParams(location.search);
  const has = k => q.has(k) && q.get(k).trim() !== '';
  if (has('total')) $('total').value = q.get('total');
  if (has('n')) $('count').value = q.get('n');
  if (has('step') && [...$('step').options].some(o => o.value === q.get('step'))) $('step').value = q.get('step');
  if (has('ratio')) {
    const r = q.get('ratio').split('-');
    if (r.length === 3) [$('rHi').value, $('rMid').value, $('rLo').value] = r;
  }
  if (has('min') && has('max')) { $('min').value = q.get('min'); $('max').value = q.get('max'); state.auto.range = false; }
  if (has('maxPer')) { $('maxPer').value = q.get('maxPer'); state.auto.maxPer = false; }
  const k = parseInt(q.get('kinds'), 10);
  if (k > 0) $('kinds').value = k;
  if (has('skip') && [...$('maxSkip').options].some(o => o.value === q.get('skip'))) $('maxSkip').value = q.get('skip');
  if (has('exclude')) $('exclude').value = q.get('exclude').split(',').join(', ');
  if (has('lock')) {
    state.locks = q.get('lock').split(',')
      .map(t => t.split('x').map(Number))
      .filter(([v, c]) => v > 0 && Number.isInteger(c) && c >= 0)
      .sort((a, b) => b[0] - a[0]);
  }
  const alt = parseInt(q.get('alt'), 10);
  if (alt > 1) state.pendingAlt = alt - 1;
  if (has('min') || has('maxPer') || has('skip') || has('exclude')) $('advanced').open = true;
}

/* ───────────── 계산 ───────────── */
// 배점 가지수 칸: 비우면 자동(가장 좋은 가지수). 비어 있을 때 회색 글자로 그 가지수를 보여 준다
function setKinds(value, best) {
  $('kinds').value = value ? String(value) : '';
  $('kinds').placeholder = best ? `자동 (${best}가지)` : '자동';
}

// 결과 카드는 늘 보인다. 보여 줄 결과가 없으면 흐리게 두고 복사 단추만 잠글 뿐 없애지 않는다
function setIdle(idle) {
  $('resultSec').classList.toggle('is-idle', idle);
  $('resultSec').setAttribute('aria-disabled', String(idle));
  $('copyBtn').disabled = $('linkBtn').disabled = idle;
  $('emptyMsg').classList.toggle('hidden', !idle);
}

// stale(): 더 새 계산이 시작됐으면 true - 그때는 결과를 버린다
async function run(stale = () => false) {
  const o = readOptions();
  state.calculated = snapshot();
  const bad = checkInputs(o);
  if (bad) return showError(bad);

  // 가지수를 정하지 않은 조건으로 가지수마다 가장 좋은 안을 찾는다 (기본 조건이면 미리 계산한 결과)
  const free = { ...o, kinds: 0, maxPer: num('maxPer') };
  const hit = state.precalc && state.precalc.get(X.keyOf(free));
  let res;
  if (hit) {
    res = { options: hit.solved, relaxed: hit.relaxed,
            byKinds: hit.byKinds.map(k => ({ ...k, solution: X.expand(hit.solved, k.groups) })) };
  } else {
    res = await solveAsync(free, { perKinds: true });
    if (stale()) return;
  }
  if (res.error) return showError(res.error);

  // alts: 같은 가지수에서 점수 순으로 찾아 둔 안들, alt: 지금 보는 순번
  const list = res.byKinds.map(k => ({ ...k, relaxed: res.relaxed, options: res.options, alts: [k.solution], alt: 0 }));
  const best = list.slice().sort((a, b) => b.score - a.score)[0].kinds;
  const keep = state.keepView;
  state.keepView = 0;
  let want = o.kinds || (keep && list.some(k => k.kinds === keep) ? keep : best);
  // 고른 가지수가 기본 조건으로 안 되면 그 가지수만 따로 (필요하면 조건을 풀어) 찾는다
  if (!list.some(k => k.kinds === want)) {
    const r = await solveAsync(o, { limit: 1 });
    if (stale()) return;
    if (r.error) return showError(`배점 ${want}가지로는 나눌 수 없습니다. ` + r.error);
    list.push({ kinds: want, found: r.found, score: r.solutions[0].score, solution: r.solutions[0], relaxed: r.relaxed, options: r.options, alts: [r.solutions[0]], alt: 0 });
  }
  list.sort((a, b) => a.kinds - b.kinds);

  setKinds(want === best ? 0 : want, best);
  state.calculated = snapshot();

  state.result = { list, best };
  state.view = want;
  $('errorBox').classList.add('hidden');
  setIdle(false);
  for (const id of ['navRow', 'tableWrap', 'stats', 'summary']) $(id).classList.remove('hidden');
  render();
  // 주소에 "몇 번째 안"이 있으면 거기까지 찾아 간다
  if (state.pendingAlt) {
    const target = state.pendingAlt;
    state.pendingAlt = 0;
    await goAlt(target, stale);
  }
}

// 에러 줄에는 바로 누를 수 있는 해결책을 함께 놓는다 (세부 조건 열기, 자동으로 되돌리기, 고정 해제)
function errorActions() {
  const row = el('div', 'callout-actions');
  const add = (text, fn) => {
    const b = el('button', 'link', text);
    b.type = 'button';
    b.addEventListener('click', fn);
    row.append(b);
  };
  if (!$('advanced').open) add('세부 조건 열기', () => { $('advanced').open = true; $('min').focus(); });
  if (!state.auto.range || !state.auto.maxPer) {
    add('배점 범위·최대 문항 수 자동으로 되돌리기', () => {
      state.auto.range = true;
      state.auto.maxPer = true;
      fillAuto();
      calculate();
    });
  }
  if (Number($('kinds').value) > 0) add('배점 가지수 자동으로', () => { setKinds(0, null); calculate(); });
  if (state.locks.length) add('고정 모두 해제', () => { state.locks = []; renderLocks(); calculate(); });
  return row.children.length ? row : null;
}

function showError(msg) {
  state.result = null;
  writeUrl();
  renderLocks();
  $('errorBox').replaceChildren(el('p', '', msg));
  const actions = errorActions();
  if (actions) $('errorBox').append(actions);
  $('errorBox').classList.remove('hidden');
  $('relaxBox').classList.add('hidden');
  $('noteBox').classList.add('hidden');
  // 고정 때문에 해가 없을 수 있으니 고정 해제 줄은 남긴다
  setIdle(true);
  for (const id of ['navRow', 'tableWrap', 'stats', 'summary']) $(id).classList.add('hidden');
  for (const id of ['tbody', 'tfoot', 'stats']) $(id).replaceChildren();
  $('pickLabel').textContent = '해 없음';
  $('prevBtn').disabled = $('nextBtn').disabled = true;
  $('summary').textContent = '';
}

function renderRelaxed(res) {
  const box = $('relaxBox');
  box.replaceChildren();
  if (!res.relaxed || !res.relaxed.length) { box.classList.add('hidden'); return; }
  box.append(el('b', '', '입력한 조건으로는 나눌 수 없어 조건을 완화했습니다: '), res.relaxed.join(' '));
  const apply = el('button', 'link', '세부 조건에 반영');
  apply.style.marginLeft = '.5rem';
  apply.type = 'button';
  apply.addEventListener('click', () => {
    const o = res.options;
    state.auto.range = false;
    state.auto.maxPer = false;
    $('min').value = o.min; $('max').value = o.max; $('maxPer').value = o.maxPer;
    fillAuto();
    calculate();
  });
  box.append(apply);
  box.classList.remove('hidden');
}

// 배점 간격이 촘촘하면 탐색 표가 너무 커져 가지수별로 찾지 못하고 가장 좋은 가지수 하나만 찾는다.
// ◀ ▶가 잠긴 까닭을 알려 주고, 간격을 한 단계 넓혀 볼 수 있게 한다
function renderNote(e, step) {
  const box = $('noteBox');
  box.replaceChildren();
  if (!e.onlyBest && !e.altNote) { box.classList.add('hidden'); return; }
  if (e.altNote) box.append(el('p', '', '다른 안은 더 찾지 못했습니다. ' + e.altNote));
  if (e.onlyBest) {
    box.append(el('b', '', '찾아볼 배점이 많아 '),
      `배점 ${e.kinds}가지 하나만 찾았습니다. 다른 가지수도 보려면 배점 간격을 넓히거나, 세부 조건에서 배점 범위를 좁히세요.`);
  }
  const wider = [...$('step').options].map(o => Number(o.value)).find(v => v > step);
  if (wider) {
    const b = el('button', 'link', `배점 간격 ${wider}점으로 넓히기`);
    b.style.marginLeft = '.5rem';
    b.type = 'button';
    b.addEventListener('click', () => { $('step').value = String(wider); fillAuto(); calculate(); });
    box.append(b);
  }
  box.classList.remove('hidden');
}

/* ───────────── 결과 ───────────── */
function entry() {
  return state.result.list.find(k => k.kinds === state.view);
}
function current() {
  const e = entry();
  return e.alts[e.alt];
}

function render() {
  const { list, best } = state.result;
  const e = entry();
  const s = current();
  const step = e.options.step;
  writeUrl();
  renderLocks();
  renderRelaxed(e);

  const at = list.indexOf(e);
  // 가지수 하나만 계산한 경우(배점 간격이 아주 촘촘할 때)는 조합 수를 알 수 없다
  const label = $('pickLabel');
  label.replaceChildren(el('span', '', `배점 ${e.kinds}가지`));
  if (e.kinds === best || e.onlyBest) label.append(el('span', 'tag', '최적'));
  $('pickMeta').textContent = e.onlyBest ? '' : `조합 ${countText(e.found)}개`;
  $('prevBtn').disabled = at === 0;
  $('nextBtn').disabled = at === list.length - 1;
  $('altLabel').textContent = e.alt === 0 ? '가장 좋은 안' : `${e.alt + 1}번째 안`;
  $('altPrev').disabled = e.alt === 0 || state.altBusy;
  $('altNext').disabled = e.alt + 1 >= e.found || state.altBusy;

  const tb = $('tbody');
  tb.replaceChildren();
  // 문항 수를 0으로 고정한 배점도 제자리에 회색 줄로 남겨, 그 줄에서 다시 고치거나 풀 수 있게 한다
  const zeros = state.locks.filter(([, c]) => c === 0)
    .map(([v]) => ({ value: v, count: 0, subtotal: 0, gap: null, tier: '', locked: true, zero: true }));
  const shown = s.rows.concat(zeros).sort((a, b) => b.value - a.value);
  for (const r of shown) {
    const tr = el('tr', r.zero ? 'zero' : r.locked ? 'locked' : '');
    const lt = el('td');
    const lb = el('button', 'lock');
    lb.type = 'button';
    lb.innerHTML = r.locked ? LOCK_ICON.on : LOCK_ICON.off;
    lb.setAttribute('aria-pressed', r.locked);
    lb.title = r.zero ? `${fmt(r.value, step)}점 다시 쓰기` : r.locked ? `${fmt(r.value, step)}점 고정 해제` : `${fmt(r.value, step)}점 ${r.count}문항으로 고정하고 나머지를 다시 계산`;
    lb.setAttribute('aria-label', lb.title);
    lb.addEventListener('click', () => setLock(r.value, r.locked ? null : r.count));
    lt.append(lb);
    const tier = el('td');
    if (r.tier) tier.append(el('span', TIER_CLS[r.tier], r.tier));
    tr.append(lt,
      el('td', 'score', fmt(r.value, step)),
      countCell(r, step),
      el('td', '', fmt(r.subtotal, step)),
      el('td', r.gap != null && r.gap > step + 1e-9 ? 'gap wide' : 'gap', r.gap == null ? '' : fmt(r.gap, step)),
      tier);
    if (r.zero) tier.append(el('span', '', '안 씀'));
    tb.append(tr);
  }
  const ft = el('tr');
  ft.append(el('td'), el('td', '', '합계'), el('td', '', s.count), el('td', '', fmt(s.total, step)), el('td'), el('td'));
  $('tfoot').replaceChildren(ft);

  // 가지수 하나만 계산한 경우 (배점 간격이 아주 촘촘할 때)
  renderNote(e, step);
  renderStats(s, step);
  $('summary').textContent = '문항 수를 고치거나 자물쇠를 누르면 그 줄을 고정하고 나머지를 다시 계산합니다 (0 = 그 배점을 안 씁니다).';
  $('copyMsg').textContent = '';
}

/* ───────────── 지표 ───────────── */
// 작은 표 하나를 만든다. rows의 각 칸은 글자 또는 { html } (색 뱃지용)
function statTable(caption, head, rows, note) {
  const box = el('div', 'stat');
  box.append(el('h3', '', caption));
  const t = el('table');
  const hr = el('tr');
  head.forEach(h => hr.append(el('th', '', h)));
  const thead = el('thead');
  thead.append(hr);
  const tbody = el('tbody');
  for (const row of rows) {
    const tr = el('tr');
    row.forEach((c, i) => {
      const td = el('td');
      if (c && typeof c === 'object') td.append(c.node); else td.textContent = c;
      tr.append(td);
    });
    tbody.append(tr);
  }
  t.append(thead, tbody);
  box.append(t);
  if (note) box.append(el('p', '', note));
  return box;
}

// 난이도별 문항 수와, 몇 문항씩 틀린 두 학생이 같은 점수가 될 확률
function renderStats(s, step) {
  const badge = name => {
    const span = el('span', TIER_CLS[name], name);
    return { node: span };
  };
  const tiers = s.tierStats.filter(t => t.count > 0).map(t =>
    [badge(t.name), `${t.count}문항`, `${fmt(t.points, step)}점`, `${t.kinds}가지`]);
  const left = statTable('난이도별 문항 수', ['난이도', '문항 수', '점수', '배점 가지수'], tiers,
    `배점 ${s.kinds}가지 · ${fmt(s.min, step)}~${fmt(s.max, step)}점 · 한 배점에 최다 ${s.maxCount}문항` +
    (s.skipped ? ` · 건너뛴 배점 ${s.skipped}칸` : ''));

  const ties = s.miss.map(m =>
    [`${m.wrong}문항`, countText(m.scores) + '가지', pct(m.tie)]);
  const right = statTable('동점이 발생할 확률', ['틀린 문항', '나올 점수', '동점 확률'], ties,
    '같은 수의 문항을 (서로 다르게) 틀린 두 학생이 같은 점수를 받을 확률입니다. 낮을수록 좋습니다.');

  $('stats').replaceChildren(left, right);
}

// 문항 수 칸은 엑셀처럼 직접 고친다. 고친 수는 그 배점에 고정되고(0이면 그 배점을 쓰지 않음)
// 나머지 문항·점수만 다시 계산한다. Enter나 다른 칸으로 옮길 때 반영된다
function countCell(r, step) {
  const n = Number($('count').value);
  const td = el('td');
  const input = el('input', 'count');
  input.type = 'number';
  input.min = '0';
  input.max = String(n);
  input.step = '1';
  input.value = r.count;
  input.setAttribute('aria-label', `${fmt(r.value, step)}점 문항 수`);
  input.title = `고치면 이 배점의 문항 수로 고정하고 나머지를 다시 계산합니다 (0 ~ ${n})`;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  // 위아래 화살표를 연달아 누르면 누를 때마다 계산하지 않고, 손을 뗀 뒤 잠깐 기다려 한 번만 계산한다
  let timer = 0;
  const commit = () => {
    clearTimeout(timer);
    let c = Math.round(Number(input.value));
    if (!Number.isFinite(c)) { input.value = r.count; return; }
    c = Math.min(Math.max(c, 0), n);
    input.value = c;
    if (c === r.count && r.locked) return;
    setLock(r.value, c);
  };
  input.addEventListener('change', () => { clearTimeout(timer); timer = setTimeout(commit, 350); });
  input.addEventListener('blur', commit);
  td.append(input);
  return td;
}

// ◀ ▶: 배점 가지수가 다른 안으로 넘긴다. 고른 가지수는 선택 상자와 주소에도 남는다
function moveView(d) {
  const { list, best } = state.result;
  const k = list[list.indexOf(entry()) + d];
  if (!k) return;
  state.view = k.kinds;
  setKinds(k.kinds === best ? 0 : k.kinds, best);
  // 이미 계산해 둔 가지수로 옮긴 것이므로 "조건이 변경되었다"고 치지 않는다
  state.calculated = snapshot();
  render();
}
// ‹ 다른 안 ›: 같은 가지수에서 점수 순으로 다음 안. 찾아 둔 것을 다 보면 10개씩 더 찾는다
async function goAlt(target, stale = () => false) {
  const e = entry();
  if (target < 0 || target >= e.found) return;
  if (target >= e.alts.length) {
    state.altBusy = true;
    $('altLabel').textContent = '찾는 중…';
    $('altNext').disabled = true;
    const want = Math.ceil((target + 1) / 10) * 10;
    const r = await solveAsync({ ...e.options, kinds: e.kinds }, { limit: want });
    state.altBusy = false;
    if (stale() || entry() !== e) return;
    if (r.error) {
      // 더 찾을 수 없으니 지금 가진 안이 전부다
      e.found = e.alts.length;
      e.altNote = r.error;
      render();
      return;
    }
    e.alts = r.solutions;
    // 조합 수(found)는 가지수를 가리지 않고 센 값이라 실제 안보다 많을 수 있다.
    // 달라고 한 만큼 못 받았으면 이게 전부이므로, 찾은 수로 바로잡아 [다른 안]을 잠근다
    e.found = r.solutions.length < want ? r.solutions.length : r.found;
    target = Math.min(target, e.alts.length - 1);
  }
  e.alt = target;
  render();
}
$('altPrev').addEventListener('click', () => goAlt(entry().alt - 1));
$('altNext').addEventListener('click', () => goAlt(entry().alt + 1));
$('prevBtn').addEventListener('click', () => moveView(-1));
$('nextBtn').addEventListener('click', () => moveView(1));

/* ───────────── 엑셀로 복사 ───────────── */
// 표는 [[칸, …], …]이고 칸은 문자열(글자) 또는 { n: 숫자, d: 소수 자릿수 }.
// 클립보드에 HTML 표와 탭 구분 글자를 함께 넣는다. 엑셀·구글 시트는 HTML을 읽어
// 4.0이 4로 바뀌지 않게 숫자 서식을 지키고, 메모장 같은 곳에는 탭 구분 글자가 붙는다.
const numCell = (n, d) => ({ n, d });
const cellText = c => (c && typeof c === 'object' ? c.n.toFixed(c.d) : String(c ?? ''));
const escHtml = t => t.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

function toTsv(table) {
  return table.map(row => row.map(cellText).join('\t')).join('\r\n');
}

function toHtml(table) {
  const td = (c, head) => {
    const tag = head ? 'th' : 'td';
    const base = 'border:1px solid #8FA39A;padding:2px 6px;';
    if (c && typeof c === 'object') {
      const f = c.d ? '0.' + '0'.repeat(c.d) : '0';
      return `<${tag} style="${base}text-align:right;mso-number-format:'${f}'">${cellText(c)}</${tag}>`;
    }
    // 글자 칸은 엑셀이 날짜·숫자로 바꾸지 않게 텍스트 서식으로
    return `<${tag} style="${base}mso-number-format:'\\@'${head ? ';background:#2B4560;color:#fff;font-weight:bold' : ''}">${escHtml(cellText(c))}</${tag}>`;
  };
  const rows = table.map((row, i) => '<tr>' + row.map(c => td(c, i === 0)).join('') + '</tr>').join('');
  return '<html><head><meta charset="utf-8"></head><body><table style="border-collapse:collapse">' + rows + '</table></body></html>';
}

async function copyTable(table) {
  const tsv = toTsv(table), html = toHtml(table);
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([tsv], { type: 'text/plain' }),
    })]);
    return;
  } catch (e) {
    // ClipboardItem이 없거나 막힌 브라우저: copy 이벤트에 두 형식을 직접 싣는다
  }
  const onCopy = e => {
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', tsv);
    e.preventDefault();
  };
  document.addEventListener('copy', onCopy);
  try {
    if (!document.execCommand('copy')) throw new Error('copy');
  } finally {
    document.removeEventListener('copy', onCopy);
  }
}

// 화면의 배점표 그대로 (고정 열 제외)
function excelTable(s, step) {
  const d = X.decimalsOf(step);
  const out = [['배점', '문항 수', '배점계', '급간', '난이도']];
  for (const r of s.rows) {
    out.push([numCell(r.value, d), numCell(r.count, 0), numCell(r.subtotal, d), r.gap == null ? '' : numCell(r.gap, d), r.tier]);
  }
  out.push(['합계', numCell(s.count, 0), numCell(s.total, d), '', '']);
  return out;
}

$('copyBtn').addEventListener('click', async () => {
  try {
    await copyTable(excelTable(current(), entry().options.step));
    $('copyMsg').textContent = '복사했습니다. 엑셀에 붙여 넣으세요.';
  } catch (e) {
    $('copyMsg').textContent = '이 브라우저에서는 클립보드에 쓸 수 없습니다.';
  }
});

$('linkBtn').addEventListener('click', async () => {
  writeUrl();
  try {
    await navigator.clipboard.writeText(location.href);
    $('copyMsg').textContent = '이 설정의 링크를 복사했습니다.';
  } catch (e) {
    $('copyMsg').textContent = '주소창의 주소를 복사하세요.';
  }
});

/* ───────────── 미리 계산한 결과 ───────────── */
// 100점·0.1/0.5점 간격·기본 조건이면 탐색 없이 precalc.json의 결과를 쓴다
async function loadPrecalc() {
  try {
    const res = await fetch('./precalc.json', { cache: 'no-cache' });
    if (!res.ok) return;
    state.precalc = new Map((await res.json()).map(e => [e.key, e]));
  } catch (e) {
    // 없으면 실시간 탐색만 쓴다
  }
}

/* ───────────── 테마 ───────────── */
(function () {
  const root = document.documentElement, btn = $('themeToggle');
  const sync = () => btn.setAttribute('aria-label', root.dataset.theme === 'dark' ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
  sync();
  btn.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    sync();
  });
})();

startWorker();
readUrl();
fillAuto();
loadPrecalc().finally(calculate);
</script>
</body>
</html>
