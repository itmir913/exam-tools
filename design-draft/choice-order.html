<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지필평가 선택지 정렬기 (시안)</title>
<style>
  /* 시안: 빌드·Tailwind 없이 한 파일로 본다. 글자는 전부 1rem 이상. */
  :root {
    --bg: #f6f5f2;          /* 종이 같은 따뜻한 회백색 */
    --panel: #ffffff;
    --ink: #1c1b1a;
    --muted: #6b6862;
    --line: #e4e1da;
    --line-strong: #cfcbc1;
    --accent: #3b4cca;      /* 단 하나의 포인트 색 */
    --accent-ink: #ffffff;
    --accent-soft: #eceefc;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(28,27,26,.04), 0 8px 24px -12px rgba(28,27,26,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1b1b1e; --ink: #ecebe8; --muted: #a09d96;
      --line: #2b2b2f; --line-strong: #3b3b41;
      --accent: #8c9bff; --accent-ink: #11122a; --accent-soft: #23253f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.6 "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
  h1 { margin: 0; font-size: 2rem; line-height: 1.2; letter-spacing: -.02em; }
  .lede { margin: .5rem 0 0; color: var(--muted); max-width: 40rem; }
  .privacy { display: flex; align-items: center; gap: .5rem; margin: .75rem 0 0; color: var(--muted); }
  .crumb { display: inline-block; margin-bottom: .9rem; padding: .3rem .9rem; border-radius: 999px; text-decoration: none;
           font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 1px solid transparent;
           transition: border-color .15s; }
  .crumb:hover { border-color: var(--accent); }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #2e9d6b; }

  .layout { display: grid; gap: 1.5rem; grid-template-columns: 22rem 1fr; align-items: start; }
  @media (max-width: 62rem) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .settings { padding: 1.5rem; display: grid; gap: 1.5rem; position: sticky; top: 1rem; }
  @media (max-width: 62rem) { .settings { position: static; } }
  .group h2 { margin: 0 0 .6rem; font-size: 1rem; font-weight: 700; }

  /* 고르는 칩: 틈 없이 붙은 알약 대신, 떨어진 칩이 줄바꿈되어도 깔끔하다 */
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { font: inherit; font-weight: 600; cursor: pointer; padding: .35rem .85rem; border-radius: 999px;
          border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
          transition: background .15s, border-color .15s, color .15s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .checks { display: grid; gap: .6rem; }
  .checks label { display: flex; gap: .6rem; align-items: center; cursor: pointer; }
  .checks input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }

  .main { display: grid; gap: 1.5rem; }
  .block { padding: 1.5rem; }
  .block-head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .block-head h2 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
  .meta { color: var(--muted); }
  .spacer { margin-left: auto; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }

  .btn { font: inherit; font-weight: 600; cursor: pointer; padding: .5rem 1rem; border-radius: 10px;
         border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); transition: background .15s, border-color .15s; }
  .btn { text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }

  textarea, pre.out {
    width: 100%; margin: 0; padding: 1rem 1.1rem; min-height: 9rem; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
    font: inherit; font-size: 1.0625rem; line-height: 1.8; white-space: pre; tab-size: 16; overflow-x: auto;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; margin-top: 1.25rem; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--muted); padding: .5rem .75rem; border-bottom: 1px solid var(--line-strong); }
  td { padding: .65rem .75rem; border-bottom: 1px solid var(--line); }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: var(--accent-soft); }
  .num { width: 4.5rem; font-weight: 700; color: var(--accent); }
  .right { text-align: right; width: 6.5rem; }
  .hint { margin: .9rem 0 0; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <!-- 상위(도구 모음)로 올라가는 배지. 누르면 랜딩으로 간다 -->
      <a class="crumb" href="../">&larr; 지필평가 도구</a>
      <h1>지필평가 선택지 정렬기</h1>
      <p class="lede">원안지의 선택지나 보기를 붙여 넣으면 글자 수나 사전순으로 정리합니다.</p>
      <!-- 안심 문구는 알림일 뿐이라 눌리지 않게 두고, 내려받기는 따로 단추로 뺀다 -->
      <p class="privacy"><span class="dot"></span>입력한 내용은 이 브라우저 밖으로 나가지 않습니다</p>
    </div>
    <a class="btn" href="#">오프라인용 내려받기 (.zip)</a>
  </header>

  <div class="layout">

    <!-- 왼쪽: 설정 -->
    <aside class="panel settings" aria-label="정렬 조건">
      <div class="group">
        <h2>정렬</h2>
        <div class="chips" role="group" aria-label="정렬 기준">
          <button class="chip" aria-pressed="false">원본 순서</button>
          <button class="chip" aria-pressed="true">짧은 순</button>
          <button class="chip" aria-pressed="false">긴 순</button>
          <button class="chip" aria-pressed="false">사전순</button>
          <button class="chip" aria-pressed="false">사전 역순</button>
          <button class="chip" aria-pressed="false">머리말 묶음 → 짧은 순</button>
        </div>
      </div>
      <div class="group">
        <h2>번호</h2>
        <div class="chips" role="group" aria-label="번호 모양">
          <button class="chip" aria-pressed="true">원본</button>
          <button class="chip" aria-pressed="false">①②③</button>
          <button class="chip" aria-pressed="false">㉠㉡㉢</button>
          <button class="chip" aria-pressed="false">ㄱㄴㄷ</button>
          <button class="chip" aria-pressed="false">1. 2. 3.</button>
          <button class="chip" aria-pressed="false">(1)(2)</button>
          <button class="chip" aria-pressed="false">A. B. C.</button>
          <button class="chip" aria-pressed="false">(가)(나)</button>
          <button class="chip" aria-pressed="false">없음</button>
        </div>
      </div>
      <div class="group">
        <h2>배치</h2>
        <div class="chips" role="group" aria-label="답항 배치">
          <button class="chip" aria-pressed="true">원본</button>
          <button class="chip" aria-pressed="false">1행</button>
          <button class="chip" aria-pressed="false">2행</button>
          <button class="chip" aria-pressed="false">3행</button>
          <button class="chip" aria-pressed="false">4행</button>
          <button class="chip" aria-pressed="false">5행</button>
        </div>
      </div>
      <div class="group">
        <h2>구분자</h2>
        <div class="chips" role="group" aria-label="구분자">
          <button class="chip" aria-pressed="false">원본</button>
          <button class="chip" aria-pressed="false">공백 1칸</button>
          <button class="chip" aria-pressed="true">탭</button>
          <button class="chip" aria-pressed="false">탭 2칸</button>
          <button class="chip" aria-pressed="false">공백 4칸</button>
        </div>
      </div>
      <div class="group">
        <h2>옵션</h2>
        <div class="checks">
          <label><input type="checkbox" checked> 선택지 앞뒤 공백 제거</label>
          <label><input type="checkbox" checked> 여러 줄 선택지를 한 줄로</label>
          <label><input type="checkbox"> 글자 수 계산 시 공백 제외</label>
        </div>
      </div>
    </aside>

    <!-- 오른쪽: 붙여 넣기 → 결과 -->
    <div class="main">
      <section class="panel block" aria-label="붙여 넣기">
        <div class="block-head">
          <h2>붙여 넣기</h2>
          <span class="meta">객관식 선택지 · 5개</span>
          <span class="spacer">
            <button class="btn">예시 넣기</button>
            <button class="btn">비우기</button>
          </span>
        </div>
        <textarea spellcheck="false" aria-label="선택지 붙여 넣기">① 사과	② 바나나	③ 복숭아	④ 블루베리	⑤ 참외</textarea>
      </section>

      <section class="panel block" aria-label="정렬 결과">
        <div class="block-head">
          <h2>정렬 결과</h2>
          <span class="spacer">
            <span class="meta">복사했습니다</span>
            <button class="btn primary">결과 복사</button>
          </span>
        </div>
        <pre class="out">① 사과	② 참외	③ 바나나	④ 복숭아	⑤ 블루베리</pre>

        <table>
          <thead><tr><th>번호</th><th>선택지</th><th class="right">글자 수</th><th class="right">원본</th></tr></thead>
          <tbody>
            <tr><td class="num">①</td><td>사과</td><td class="right">2</td><td class="right">1</td></tr>
            <tr><td class="num">②</td><td>참외</td><td class="right">2</td><td class="right">5</td></tr>
            <tr><td class="num">③</td><td>바나나</td><td class="right">3</td><td class="right">2</td></tr>
            <tr><td class="num">④</td><td>복숭아</td><td class="right">3</td><td class="right">3</td></tr>
            <tr><td class="num">⑤</td><td>블루베리</td><td class="right">4</td><td class="right">4</td></tr>
          </tbody>
        </table>
        <p class="hint">줄을 누르면 그 선택지만 복사합니다.</p>
      </section>
    </div>
  </div>
</div>
<script>
  // 시안용: 칩을 누르면 같은 줄 안에서 하나만 선택된다
  document.querySelectorAll('.chips').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    g.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  }));
</script>
</body>
</html>
