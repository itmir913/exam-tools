# GitHub Pages 배포와 릴리스 갱신.
#
# main에 push할 때마다 사이트를 빌드해 올리고, 같은 실행에서 도구마다 zip을 만들어
# latest 릴리스에 갱신한다. 두 일을 한 워크플로에 둔 이유는 둘이 같은 것을 배포하기
# 때문이다. 따로 두면 사이트와 내려받는 zip이 서로 다른 커밋을 가리키는 때가 생긴다.
# release 잡은 deploy 잡이 성공해야 돌아간다 - 배포가 실패했는데 zip만 새것으로
# 바뀌는 상황을 막는다.
#
# 올리는 것은 저장소 뿌리가 아니라 빌드 결과(dist)다. 도구 폴더마다 쓰는 CSS와
# 글꼴이 그 폴더 안에 들어 있어, 폴더 하나만 받아도 인터넷 없이 열린다.
#
# 저장소 설정이 Settings → Pages → Source: GitHub Actions 여야 한다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나만 돌린다.
# 진행 중인 배포를 취소하지 않는다 - 중간에 끊으면 사이트가 반쯤 갱신된 채 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # 배포 전에 검사한다 (글자 크기 + 도구별 테스트). 하나라도 걸리면 사이트는 그대로 둔다
      - name: Check
        run: npm run ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # release 잡이 같은 빌드를 그대로 묶도록 넘긴다 (다시 빌드하지 않는다)
      - name: Hand the build to the release job
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Update latest release
    needs: deploy          # 배포가 성공한 뒤에만 올린다
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 릴리스를 만들고 갱신하는 데 필요하다

    steps:
      - name: Download the build
        uses: actions/download-artifact@v6
        with:
          name: site
          path: dist

      - name: Zip each tool folder individually
        working-directory: dist
        run: |
          for dir in */; do
            dir_name="${dir%/}"

            # 도구는 제 index.html을 가진 폴더다. 랜딩이 쓰는 assets 같은
            # 곁딸린 폴더는 내려받을 것이 아니므로 건너뛴다.
            if [[ ! -f "$dir_name/index.html" ]]; then
              continue
            fi

            echo "Zipping folder: $dir_name -> $dir_name.zip"
            (cd "$dir_name" && zip -r "../../${dir_name}.zip" .)
          done

      - name: Upload zips to latest release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          artifacts: "*.zip"
          allowUpdates: true          # 기존 latest 릴리스를 갱신한다
          replacesArtifacts: true     # 옛 zip을 새것으로 바꾼다
          omitName: true              # 릴리스 제목을 덮어쓰지 않는다
          omitBody: true              # 릴리스 본문을 덮어쓰지 않는다
          token: ${{ secrets.GITHUB_TOKEN }}
